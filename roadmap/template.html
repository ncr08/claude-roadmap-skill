<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} roadmap</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#14202e;--muted:#5d6b7c;--line:#dde2e9;--good:#1f8a4c;--good-bg:#e5f4ea;--todo:#5d6b7c;--todo-bg:#eceff3;--warn:#a15c00;--warn-bg:#fdf0da;--bad:#b42318;--bad-bg:#fde8e6;--info:#2457d6;--info-bg:#e6eeff;--mono:ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f151d;--surface:#171f2a;--ink:#e7ecf3;--muted:#93a1b3;--line:#2a3544;--good:#52c783;--good-bg:#16301f;--todo:#93a1b3;--todo-bg:#222c39;--warn:#f0b04a;--warn-bg:#35260e;--bad:#ff8a80;--bad-bg:#3a1714;--info:#7c9dff;--info-bg:#1a2a55;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:20px}
h1{font-size:24px;margin:0}.sub{color:var(--muted);margin:4px 0 0}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.legend span{display:inline-flex;gap:6px;align-items:center}.sw{width:14px;height:14px;border-radius:4px;border:1px solid}
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative}
.stage:not(:last-child)::after{content:"▶";position:absolute;right:-13px;top:50%;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.step{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stage h2{font-size:14px;margin:0;line-height:1.3}.desc{font-size:12px;color:var(--muted);margin:0}
.frac{font:500 12px var(--mono)}.mini{height:5px;border-radius:3px;background:var(--todo-bg);overflow:hidden}.mini i{display:block;height:100%;background:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 11px var(--mono);padding:2px 5px;border-radius:4px;border:1px solid transparent;cursor:default}
.done{background:var(--good-bg);color:var(--good)}
.todo{background:var(--todo-bg);color:var(--todo);border-color:var(--todo)}
.you{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.doing{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.blocked{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.dep{font:12px var(--mono);color:var(--muted);margin:0}
@media (max-width:700px){.stage::after{display:none!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>{{TITLE}} roadmap</h1><p class="sub">{{DONE}} of {{TOTAL}} tickets done. Hover a chip for its title.</p></div>
    <div class="legend">
      <span><i class="sw done"></i>done</span><span><i class="sw doing"></i>in progress</span><span><i class="sw blocked"></i>blocked</span>
      <span><i class="sw you"></i>waiting on you</span><span><i class="sw todo"></i>to do</span>
    </div>
  </div>
  <div class="route">{{STAGES}}</div>
</main>
</body>
</html>
